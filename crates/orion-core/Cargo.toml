[package]
name = "orion-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
portable-pty = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
notify = { workspace = true }
parking_lot = { workspace = true }
subtle = { workspace = true }
rusqlite = { workspace = true }
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
rand = "0.8"
base64 = "0.22"
hkdf = { workspace = true }
aes-gcm = { workspace = true }
reqwest = { workspace = true }
signature = { workspace = true }
vt100 = "0.18.1"

[[bin]]
name = "orion"
path = "src/bin/orion.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
