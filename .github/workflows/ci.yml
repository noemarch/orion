name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  # Nothing named after the tool Orion replaces may appear in code, paths or dependencies. This
  # is an enforcement rule, not product prose: the pattern has to be spelled out to be checked.
  no-foreign-artifacts:
    name: no foreign artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan the tree
        run: |
          set -eu
          # Split so this workflow does not match itself.
          foreign="her""dr"
          if grep -rniI "$foreign" \
              --exclude-dir=node_modules \
              --exclude-dir=target \
              --exclude-dir=.git \
              --exclude-dir=dist . ; then
            echo "::error::a foreign artifact name is present"
            exit 1
          fi
          echo "clean"
