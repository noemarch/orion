name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: '0.17.1'
      - name: linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-xinerama0-dev libxcb-shape0-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: no-webview gate
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { 'target/debug/orion-ui.exe' } else { 'target/debug/orion-ui' }
          & ./scripts/check_no_webview.ps1 -Binary $bin

  # No name of the tool Orion replaces may appear in code, paths or dependencies. Historical docs
  # and recorded terminal fixtures may name it when describing the migration; those are excluded.
  # This is an enforcement rule, not product prose: the pattern has to be spelled out to be checked.
  no-foreign-artifacts:
    name: no foreign artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan the tree
        run: |
          set -eu
          # Split so this workflow does not match itself.
          foreign="her""dr"
          if grep -rniI "$foreign" \
              --exclude-dir=target \
              --exclude-dir=.git \
              --exclude-dir=docs \
              --exclude-dir=research \
              --exclude='*.ansi' \
              --exclude-dir=.superpowers \
              --exclude-dir=.omo . ; then
            echo "::error::a foreign artifact name is present"
            exit 1
          fi
          echo "clean"

  # The timeline test is ignored in the normal gate because a 200 ms wall-clock
  # budget moves under load. Run it here.
  real-agent-tests:
    name: real-agent integration tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: '0.17.1'
      - uses: Swatinem/rust-cache@v2
      - name: terminal startup timeline
        run: cargo test -p orion-ui --test terminal_startup -- --ignored --nocapture
