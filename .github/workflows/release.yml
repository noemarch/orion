name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: build binaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: '0.17.1'
      - name: linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-xinerama0-dev libxcb-shape0-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      # The app is pure Rust: the shell is `orion-ui`, the runtime and the
      # CLI are `orion`.
      - run: cargo build --release --workspace
      - name: no-webview gate
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { 'target/release/orion-ui.exe' } else { 'target/release/orion-ui' }
          ./scripts/check_no_webview.ps1 -Binary $bin
      - name: collect the binaries
        id: artifacts
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          case "${{ matrix.os }}" in
            windows-latest) suffix=".exe" ;;
            *) suffix="" ;;
          esac
          for name in orion orion-ui orion-rt; do
            cp "target/release/${name}${suffix}" "dist/${name}-${{ matrix.os }}${suffix}"
          done
          pwsh ./scripts/package-release.ps1 \
            -Version "${{ github.ref_name }}" \
            -Os "${{ matrix.os }}" \
            -BinaryDir target/release \
            -OutDir dist
          echo "artifacts=$(ls dist/* | tr '\n' ' ')" >> $GITHUB_OUTPUT
      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifacts.outputs.artifacts }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
