name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: build installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo tauri build --conf ../src-tauri/tauri.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: find installer artifacts
        id: artifacts
        run: |
          artifacts=$(find src-tauri/target/release/bundle -type f | tr '\n' ' ')
          echo "artifacts=${artifacts}" >> $GITHUB_OUTPUT
      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifacts.outputs.artifacts }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
