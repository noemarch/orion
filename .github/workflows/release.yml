name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: build binaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The app is pure Rust: the shell is `orion-ui`, the runtime and the
      # CLI are `orion`.
      - run: cargo build --release --workspace
      - name: no-webview gate
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { 'target/release/orion-ui.exe' } else { 'target/release/orion-ui' }
          ./scripts/check_no_webview.ps1 -Binary $bin
      - name: collect the binaries
        id: artifacts
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          case "${{ matrix.os }}" in
            windows-latest) suffix=".exe" ;;
            *) suffix="" ;;
          esac
          for name in orion orion-ui; do
            cp "target/release/${name}${suffix}" "dist/${name}-${{ matrix.os }}${suffix}"
          done
          echo "artifacts=$(ls dist/* | tr '\n' ' ')" >> $GITHUB_OUTPUT
      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifacts.outputs.artifacts }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
